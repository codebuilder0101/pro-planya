<!doctype html>
<html lang="es-CL">
  <body style="margin:0;padding:24px;background:#f4f7f5;font-family:-apple-system,Segoe UI,Inter,Roboto,Arial,sans-serif;color:#10241b;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:16px;padding:32px;">
      <tr>
        <td>
          <h1 style="margin:0 0 16px;font-size:22px;">Restablece tu contraseña</h1>
          <p style="margin:0 0 24px;font-size:16px;line-height:24px;">
            Recibimos una solicitud para cambiar la contraseña de tu cuenta PlanYá. Ingresa este código en la app:
          </p>
          <p style="margin:0 0 24px;font-size:32px;font-weight:700;letter-spacing:8px;text-align:center;color:#1f5c3f;">
            {{ .Token }}
          </p>
          <p style="margin:0;font-size:14px;line-height:20px;color:#5b6b63;">
            El código vence en 1 hora. Si no fuiste tú, puedes ignorar este correo.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
